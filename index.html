<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Night Sky</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="sky">
    <div id="info">
      <h1 id="title">Night Sky</h1>
      <p id="clock">00:00:00</p>
      <p>Click anywhere to add a star!</p>
    </div>
  </div>

  <div id="controls">
    <p>Stars: <span id="count">0</span></p>
    <button id="clearBtn">Clear Stars</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
